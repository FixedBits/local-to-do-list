<!DOCTYPE html>

    <!-- Note: Revising theme-color #11ffc4-->
    <meta name="theme-color" content="#11ffc4" />
    <meta name="description" content="📋 A simple local To-Do list app to manage your tasks efficiently." />
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png" />

    <script src="app.js" defer></script>
    <title>Local To-Do List</title>

            <div class="local-storage-container">

                <span> Local</span>
                <span>Storage</span>
              </p>
            </div>
          </div>

          <img src="images/app-icon.webp" alt="To-Do List App Icon" loading="lazy" oncontextmenu="return false"
            ondragstart="return false" />
        </div>
        <div class="content-wrapper">
          <form data-aos="fade-down">
            <input id="todo-input" type="text" placeholder="Write a task..." autocomplete="off" />

            <!-- By default, button is type='submit' when inside a form element -->
            <button id="add-btn">ADD</button>
          </form>
